<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2400"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B0082"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="128" height="256" rx="0"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="128" y="0" width="128" height="256"/>
    </clipPath>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="256" height="256" rx="48"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#leftBg)" clip-path="url(#leftHalf)"/>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#rightBg)" clip-path="url(#rightHalf)"/>

  <!-- Subtle center divider -->
  <rect x="126" y="0" width="4" height="256" fill="white" opacity="0.15" clip-path="url(#roundedClip)"/>

  <!-- ── FIRE (left side) ── -->
  <!-- Outer flame — amber -->
  <path d="M 68 210
           C 30 185  20 155  38 118
           C 44 138  52 132  56 118
           C 58 105  54 88   62 72
           C 70 92   66 108  72 120
           C 80 104  84 86   94 70
           C 98 96   88 116  92 132
           C 98 118  106 105 110 94
           C 114 120 104 148 100 168
           C 94 190  80 210  68 210 Z"
        fill="#FFD000"/>
  <!-- Mid flame — orange -->
  <path d="M 68 205
           C 38 182  30 154  46 122
           C 51 140  58 134  62 122
           C 64 110  61 95   68 80
           C 75 98   72 112  77 123
           C 84 108  88 92   97 77
           C 100 101 91 119  95 134
           C 100 121 107 109 111 99
           C 114 123 105 149 101 167
           C 96 188  81 205  68 205 Z"
        fill="#FF6A00"/>
  <!-- Inner flame — red -->
  <path d="M 72 200
           C 50 178  44 155  58 128
           C 62 144  68 138  71 128
           C 73 117  71 103  77 90
           C 83 107  80 119  84 129
           C 90 116  93 102  101 89
           C 103 111 96 128  99 142
           C 103 130 109 119 112 110
           C 115 131 107 155 103 170
           C 98 188  84 200  72 200 Z"
        fill="#FF2400" opacity="0.9"/>
  <!-- Bright core -->
  <path d="M 76 195
           C 60 175  58 155  68 135
           C 72 148  76 142  78 134
           C 80 124  79 112  84 100
           C 89 115  86 126  89 135
           C 94 123  97 111  103 100
           C 105 120 99 135  101 147
           C 105 136 109 127 112 119
           C 113 138 107 160 103 172
           C 98 187  85 195  76 195 Z"
        fill="#FFE040" opacity="0.7"/>

  <!-- ── SNOWFLAKE (right side) ── -->
  <g transform="translate(182, 128)" stroke="white" stroke-linecap="round">
    <!-- 6 main arms -->
    <line x1="-44" y1="0"    x2="44" y2="0"    stroke-width="5"/>
    <line x1="-22" y1="-38"  x2="22" y2="38"   stroke-width="5"/>
    <line x1="22"  y1="-38"  x2="-22" y2="38"  stroke-width="5"/>
    <!-- Arm branches — horizontal arm -->
    <line x1="-32" y1="-11"  x2="-20" y2="0"   stroke-width="3.5"/>
    <line x1="-32" y1="11"   x2="-20" y2="0"   stroke-width="3.5"/>
    <line x1="32"  y1="-11"  x2="20"  y2="0"   stroke-width="3.5"/>
    <line x1="32"  y1="11"   x2="20"  y2="0"   stroke-width="3.5"/>
    <!-- Arm branches — upper-left arm -->
    <line x1="-28" y1="-27"  x2="-14" y2="-22" stroke-width="3.5"/>
    <line x1="-17" y1="-37"  x2="-14" y2="-22" stroke-width="3.5"/>
    <!-- Arm branches — upper-right arm -->
    <line x1="17"  y1="-37"  x2="14"  y2="-22" stroke-width="3.5"/>
    <line x1="28"  y1="-27"  x2="14"  y2="-22" stroke-width="3.5"/>
    <!-- Arm branches — lower-left arm -->
    <line x1="-28" y1="27"   x2="-14" y2="22"  stroke-width="3.5"/>
    <line x1="-17" y1="37"   x2="-14" y2="22"  stroke-width="3.5"/>
    <!-- Arm branches — lower-right arm -->
    <line x1="17"  y1="37"   x2="14"  y2="22"  stroke-width="3.5"/>
    <line x1="28"  y1="27"   x2="14"  y2="22"  stroke-width="3.5"/>
    <!-- Center hex -->
    <circle cx="0" cy="0" r="7" fill="white" stroke="none"/>
  </g>

  <!-- ── THERMOMETER (center) ── -->
  <!-- Outer shell -->
  <rect x="116" y="44" width="24" height="140" rx="12" fill="white"/>
  <!-- Bulb outer -->
  <circle cx="128" cy="196" r="24" fill="white"/>
  <!-- Mercury tube -->
  <rect x="122" y="108" width="12" height="81" rx="6" fill="#FF2400"/>
  <!-- Bulb fill -->
  <circle cx="128" cy="196" r="17" fill="#FF2400"/>
  <!-- Tube top cap shine -->
  <ellipse cx="128" cy="56" rx="6" ry="4" fill="white" opacity="0.6"/>
  <!-- Tick marks -->
  <line x1="140" y1="76"  x2="148" y2="76"  stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="93"  x2="148" y2="93"  stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="110" x2="148" y2="110" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="127" x2="148" y2="127" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="144" x2="148" y2="144" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="161" x2="148" y2="161" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
